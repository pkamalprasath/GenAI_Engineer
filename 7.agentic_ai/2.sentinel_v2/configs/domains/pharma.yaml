# Pharma domain: Clinical trial data integrity and FDA compliance
domain_id: pharma
display_name: "Clinical Trial Compliance"
description: "Investigates AI-assisted clinical trial decisions for FDA 21 CFR Part 11 compliance"

regulations:
  - filename: fda_21cfr11.pdf
    name: "FDA 21 CFR Part 11 — Electronic Records"
    jurisdiction: US
    effective_date: "1997-08-20"

decision_schema:
  entity_type: trial_outcome
  id_field: subject_id
  outcome_field: efficacy_verdict
  outcome_values: [effective, not_effective, inconclusive]
  allowed_analysis_fields:
    - trial_phase
    - dosage_group
    - age_group
    - trial_site_id
    - efficacy_verdict
    - adverse_events_count
    - decision_timestamp

bias_config:
  dimensions:
    - age_group
    - trial_site_id        # Site-level inconsistency detection
    - dosage_group
  protected_classes: false
  minimum_sample_size: 20
  disparity_alert_threshold: 0.20

thresholds:
  auto_resolve_confidence: 0.90   # Higher bar for clinical decisions
  escalation_risk_levels: [MEDIUM, HIGH, CRITICAL]

demo_anomalies:
  bias_cases: 15
  integrity_breaks: 8
  gdpr_violations: 0
