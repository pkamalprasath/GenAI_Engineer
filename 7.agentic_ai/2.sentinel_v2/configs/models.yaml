# Model routing — single source of truth, no model names hardcoded anywhere else.
# All providers and model IDs live here. Change once, applies everywhere.
#
# To switch providers: change "provider" and "model" below — zero code changes.
#
# Active provider options:
#   reasoning/synthesis provider: anthropic | openai
#   classification provider:      ollama (always local — no API cost)

models:
  # Fast classification: local llama3.2:3b — no API cost, fits in 8GB RAM
  classification:
    provider: ollama
    model: llama3.2:3b
    base_url: "${OLLAMA_BASE_URL}"
    max_tokens: 512
    temperature: 0
    timeout_seconds: 30

  # Complex reasoning: investigation, legal, bias interpretation
  # Switch between providers by changing "provider" and "model" below.
  reasoning:
    provider: openai                  # openai | anthropic
    model: gpt-4o-mini                # openai: gpt-4o-mini | gpt-4o
                                      # anthropic: claude-haiku-4-5-20251001
    max_tokens: 2048
    temperature: 0

  # Final report synthesis — highest quality output
  synthesis:
    provider: openai                  # openai | anthropic
    model: gpt-4o-mini                # gpt-4o-mini: 5x faster, same quality for structured reports
                                      # gpt-4o: slower, use for production
                                      # anthropic: claude-sonnet-4-6
    max_tokens: 2048
    temperature: 0.1

  # Embeddings: local nomic-embed-text — zero API cost, 300MB RAM
  embeddings:
    provider: ollama
    model: nomic-embed-text
    base_url: "${OLLAMA_BASE_URL}"
    dimensions: 768

  # Fallback: used if primary provider fails or key is missing
  # Switched to local Ollama so report generation works even when OpenAI auth fails
  fallback:
    provider: ollama
    model: llama3.2:3b
    base_url: "${OLLAMA_BASE_URL}"
    max_tokens: 2048
    temperature: 0

# Concurrency limits — prevents OOM on 8GB system
concurrency:
  ollama_semaphore: 1       # Only 1 local model call at a time
  api_semaphore: 5          # API calls fully parallel up to 5

# Per-agent model tier assignment (Phase 2C)
# Each agent uses get_tier_for_agent() to look up its tier from here
# Falls back to "reasoning" if agent_name not listed
agent_models:
  discovery_agent:          classification    # Fast BM25 + BERT re-ranker (Ollama)
  investigation_agent:      reasoning         # Deep case analysis + provenance
  legal_agent:              reasoning         # Regulation retrieval + compliance verdict
  bias_detection_agent:     reasoning         # Statistical analysis + LLM interpretation
  report_agent:             synthesis         # Highest quality final output
  audit_agent:              classification    # Fast pattern checks (Ollama)
  pattern_extractor:        classification    # Extract compliance patterns (Ollama)

# Inference optimizations (Phase 3)
context:
  # Case batch size varies by provider to stay within context windows:
  #   OpenAI: gpt-4o-mini can handle ~8000 tokens input, so ~100 cases per batch
  #   Ollama: llama3.2:3b limited to ~4000 tokens, so ~25 cases per batch
  case_batch_size_openai: 100       # Chunk case processing for OpenAI
  case_batch_size_ollama:  25       # Chunk case processing for Ollama (local)
