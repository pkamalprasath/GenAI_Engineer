regulation_name: CRA
full_name: "Community Reinvestment Act"
jurisdiction: US
effective_date: "1977-10-12"
domain: finance
sections:
  - section: "12 U.S.C. § 2903 — Financial Institutions; Evaluation"
    text: |
      In connection with its examination of a financial institution, the appropriate
      Federal financial supervisory agency shall assess the institution's record of
      meeting the credit needs of its entire community, including low- and moderate-income
      neighborhoods, consistent with the safe and sound operation of such institution.
      Such record shall be taken into account in the agency's evaluation of an application
      for a deposit facility by such institution.

  - section: "12 U.S.C. § 2906 — Written Evaluations"
    text: |
      Upon the conclusion of each examination of an insured depository institution, the
      appropriate Federal financial supervisory agency shall prepare a written evaluation
      of the institution's record of meeting the credit needs of its entire community,
      including low- and moderate-income neighborhoods. Each written evaluation shall
      contain a section for public disclosure and a section for confidential use.

  - section: "12 C.F.R. § 25.21 — Lending Test"
    text: |
      The lending test evaluates a bank's record of helping to meet the credit needs
      of its assessment area(s) through its lending activities by considering a bank's
      home mortgage loans; small business and small farm loans; community development
      loans; and, if elected, consumer loans. The Board evaluates the geographic
      distribution of the bank's lending, including whether the bank is making loans
      in low- and moderate-income geographies.
