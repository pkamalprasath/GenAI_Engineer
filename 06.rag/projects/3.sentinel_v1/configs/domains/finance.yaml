# Finance domain: Credit underwriting compliance investigation
domain_id: finance
display_name: "Credit Underwriting Compliance"
description: "Investigates AI-assisted credit decisions for fair lending compliance"

regulations:
  - filename: ecoa_fair_lending.pdf
    name: "Equal Credit Opportunity Act (ECOA) & Fair Lending"
    jurisdiction: US
    effective_date: "1974-10-28"
  - filename: gdpr_article22.pdf
    name: "GDPR Article 22 — Automated Decision-Making"
    jurisdiction: EU
    effective_date: "2018-05-25"

decision_schema:
  entity_type: loan_application
  id_field: application_id
  outcome_field: outcome
  outcome_values: [approved, denied, pending]
  # Fields agents are allowed to analyze — anything outside this list is blocked
  allowed_analysis_fields:
    - credit_score_tier
    - debt_to_income_ratio
    - income_bracket
    - loan_amount_range
    - zip_code_census_tract
    - outcome
    - decision_timestamp

bias_config:
  # Demographic dimensions to test for disparate impact
  dimensions:
    - zip_code_census_tract   # Proxy for race/ethnicity (redlining detection)
    - age_group               # ECOA protected class
    - gender                  # ECOA protected class
  protected_classes: true
  # Minimum group size for statistically valid comparison
  minimum_sample_size: 30
  # Flag if approval rate gap between groups exceeds this
  disparity_alert_threshold: 0.15

thresholds:
  auto_resolve_confidence: 0.85
  escalation_risk_levels: [HIGH, CRITICAL]

# Anomalies injected into synthetic data — what agents should find in demo
demo_anomalies:
  bias_cases: 30        # Applications with detectable geographic/demographic pattern
  integrity_breaks: 10  # Cases with incomplete provenance chains
  gdpr_violations: 5    # Cases where deletion requests weren't fully honored
