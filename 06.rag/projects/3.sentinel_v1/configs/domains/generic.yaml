# Generic domain: Horizontal — works for any AI decision system
domain_id: generic
display_name: "Generic AI Decision Audit"
description: "Investigates any AI decision system for bias, integrity, and compliance"

regulations: []   # No domain-specific regulations — agents use general AI governance principles

decision_schema:
  entity_type: ai_decision
  id_field: decision_id
  outcome_field: outcome
  outcome_values: [positive, negative, neutral]
  allowed_analysis_fields:
    - input_category
    - outcome
    - confidence_score
    - model_version
    - decision_timestamp

bias_config:
  dimensions:
    - input_category
  protected_classes: false
  minimum_sample_size: 15
  disparity_alert_threshold: 0.20

thresholds:
  auto_resolve_confidence: 0.80
  escalation_risk_levels: [HIGH, CRITICAL]

demo_anomalies:
  bias_cases: 10
  integrity_breaks: 5
  gdpr_violations: 0
