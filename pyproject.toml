[tool.poetry]
name = "slack-bot-assistant"
version = "0.1.0"
description = "An intelligent Slack bot assistant with agent system, RAG, and MCP integrations"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Slack Integration
slack-bolt = {extras = ["async"], version = "^1.20.0"}
slack-sdk = "^3.33.0"

# Agent System & LLM
langgraph = "^0.2.0"
anthropic = "^0.39.0"
openai = "^1.50.0"  # For embeddings

# MCP Servers
fastmcp = "^2.0.0"

# RAG & Vector Store
chromadb = "^0.5.0"

# Data Validation & Settings
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

# Utilities
python-dotenv = "^1.0.0"
aiohttp = "^3.10.0"
apscheduler = "^3.10.0"
pyyaml = "^6.0.0"

# Database (Production)
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"

# Code Quality
black = "^24.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

# Type Stubs
types-pyyaml = "^6.0.0"
types-redis = "^4.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
