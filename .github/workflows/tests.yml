name: Tests & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint (syntax errors and undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      # Blocking: only checks that catch code which cannot run
      - run: ruff check --select E9,F63,F7,F82 --target-version py311 --exclude "*.ipynb" .

  openclaw:
    name: OpenClaw Slack agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4.openclaw-built_from_scratch/open_claw_slack_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e . pytest pytest-asyncio
      - run: pytest tests -q

  engineering-rag:
    name: Engineering RAG (with pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: 06.rag/projects/2.engineering-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest
      - run: pytest tests -q

  sentinel:
    name: SENTINEL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ 1.sentinel_v1, 2.sentinel_v2 ]
    defaults:
      run:
        working-directory: 7.agentic_ai/${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest tests -q
